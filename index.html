<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的导航</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
      :root {
        --bg-primary: #F8FAFC;
        --bg-secondary: #F1F5F9;
        --bg-tertiary: #E8F0F6;
        --text-primary: #1E293B;
        --text-secondary: #64748B;
        --text-tertiary: #94A3B8;
        --border-color: #E2E8F0;
        --primary: #6366F1;
        --primary-light: #818CF8;
        --primary-dark: #4F46E5;
        --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.03);
        --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.06);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.06);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease,
                    box-shadow 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
        color: var(--text-primary);
        min-height: 100vh;
      }

      .app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
      }

      .content-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 1200px;
        gap: 2rem;
        position: relative;
      }

      .logo-container {
        display: flex;
        align-items: center;
        justify-content: center;
        animation: slideDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .logo {
        font-size: 1.875rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .logo-icon {
        font-size: 2rem;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes slideDown {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }

      .search-container {
        width: 100%;
        max-width: 640px;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        position: relative;
      }

      .search-input-wrapper {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(10px);
        border-radius: 1rem;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-lg);
      }

      .search-input-wrapper:focus-within {
        background: rgba(255, 255, 255, 0.95);
        border-color: var(--primary);
        box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.15);
        transform: translateY(-2px);
      }

      .search-input {
        flex: 1;
        padding: 0.75rem 1rem;
        border: none;
        background: transparent;
        font-size: 1rem;
        color: var(--text-primary);
        outline: none;
        font-weight: 500;
      }

      .search-input::placeholder {
        color: var(--text-tertiary);
      }

      .search-button {
        padding: 0.75rem 1.5rem;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        border: none;
        border-radius: 0.75rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
      }

      .search-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      }

      .search-engines-container {
        display: flex;
        gap: 1.5rem;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
        animation: fadeIn 0.6s ease-out 0.2s both;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .search-engine-btn {
        position: relative;
        padding: 0.75rem 1.5rem;
        background: rgba(255, 255, 255, 0.8);
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
        border-radius: 0.875rem;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        backdrop-filter: blur(8px);
        box-shadow: var(--shadow-sm);
        min-width: 90px;
        text-align: center;
      }

      .search-engine-btn:hover {
        background: rgba(255, 255, 255, 0.95);
        border-color: var(--primary);
        color: var(--text-primary);
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
      }

      .search-engine-btn.active {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(129, 140, 248, 0.05) 100%);
        color: var(--primary);
        border-color: var(--primary);
        box-shadow: 0 10px 25px rgba(99, 102, 241, 0.15);
        font-weight: 600;
      }

      .search-engine-indicator {
        position: absolute;
        top: -14px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
        border-bottom: 10px solid var(--primary);
        animation: trianglePulse 0.6s ease-out forwards;
        z-index: 10;
      }

      @keyframes trianglePulse {
        0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
        50% { opacity: 1; }
        100% { opacity: 1; transform: translateX(-50%) scale(1); }
      }

      .category-tabs {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 2rem;
        justify-content: center;
        flex-wrap: wrap;
        width: 100%;
        animation: fadeIn 0.6s ease-out 0.3s both;
      }

      .category-tab {
        position: relative;
        padding: 0.65rem 1.25rem;
        background: rgba(255, 255, 255, 0.8);
        color: var(--text-secondary);
        border: 1px solid var(--border-color);
        border-radius: 1.5rem;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        backdrop-filter: blur(8px);
        overflow: hidden;
      }

      .category-tab::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: linear-gradient(180deg, var(--primary) 0%, var(--primary-light) 100%);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .category-tab:hover {
        background: rgba(255, 255, 255, 0.95);
        border-color: var(--primary-light);
        color: var(--text-primary);
        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
      }

      .category-tab.active {
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(129, 140, 248, 0.05) 100%);
        color: var(--primary);
        border-color: var(--primary);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.12);
        font-weight: 600;
      }

      .category-tab.active::before {
        opacity: 1;
      }

      .websites-grid {
        width: 100%;
        max-width: 1200px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 1.5rem;
        animation: fadeIn 0.6s ease-out 0.4s both;
      }

      .website-card {
        position: relative;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 1.25rem;
        padding: 1.5rem;
        box-shadow: var(--shadow-md);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        min-height: 160px;
        justify-content: center;
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      .website-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05) 0%, transparent 100%);
        opacity: 0;
        pointer-events: none;
      }

      .website-card:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        background: rgba(255, 255, 255, 0.95);
        border-color: var(--primary-light);
      }

      .website-card:hover::before {
        opacity: 1;
      }

      .website-icon {
        position: relative;
        width: 72px;
        height: 72px;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
        border-radius: 1.125rem;
        padding: 0.75rem;
        overflow: hidden;
      }

      .website-card:hover .website-icon {
        transform: scale(1.1) rotate(-5deg);
        box-shadow: 0 8px 16px rgba(99, 102, 241, 0.15);
      }

      .website-icon img {
        max-width: 100%;
        max-height: 100%;
        border-radius: 0.75rem;
      }

      .website-card:hover .website-icon img {
        transform: scale(1.15);
      }

      .website-name {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.35rem;
        line-height: 1.3;
        position: relative;
        z-index: 2;
      }

      .website-card:hover .website-name {
        color: var(--primary);
      }

      .website-url {
        font-size: 0.75rem;
        color: var(--text-tertiary);
        word-break: break-all;
        line-height: 1.2;
        position: relative;
        z-index: 2;
      }

      .website-actions {
        position: absolute;
        top: 0.75rem;
        right: 0.75rem;
        opacity: 0;
        transform: translateX(10px);
        z-index: 10;
      }

      .website-card:hover .website-actions {
        opacity: 1;
        transform: translateX(0);
      }

      .delete-button {
        background: linear-gradient(135deg, #FF6B6B 0%, #FF5252 100%);
        color: white;
        border: none;
        padding: 0.4rem 0.6rem;
        border-radius: 0.625rem;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
      }

      .delete-button:hover {
        transform: scale(1.1);
      }

      @media (max-width: 768px) {
        .app { padding: 1rem; }
        .logo { font-size: 1.5rem; }
        .search-container { max-width: 100%; }
        .search-engines-container { gap: 1rem; }
        .search-engine-btn { min-width: 70px; padding: 0.6rem 1rem; font-size: 0.85rem; }
        .category-tabs { gap: 0.5rem; }
        .category-tab { padding: 0.5rem 1rem; font-size: 0.85rem; }
        .websites-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
        .website-card { padding: 1rem; min-height: 140px; }
        .website-icon { width: 60px; height: 60px; }
      }

      @media (max-width: 480px) {
        .websites-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }
        .website-card { padding: 0.75rem; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app">
        <div class="content-container">
          <div class="logo-container">
            <div class="logo">
              <span class="logo-icon">🚀</span>
              我的导航
            </div>
          </div>
          
          <div class="search-container">
            <div class="search-input-wrapper">
              <input
                type="text"
                v-model="searchKeyword"
                placeholder="搜索网站..."
                class="search-input"
                @keyup.enter="handleSearch"
              />
              <button class="search-button" @click="handleSearch">搜索</button>
            </div>
          </div>

          <div class="search-engines-container">
            <button 
              v-for="engine in searchEngines" 
              :key="engine.id"
              class="search-engine-btn"
              :class="{ active: activeSearchEngine === engine.id }"
              @click="selectSearchEngine(engine.id)"
              style="position: relative;"
            >
              {{ engine.name }}
              <div 
                v-if="activeSearchEngine === engine.id"
                class="search-engine-indicator"
              ></div>
            </button>
          </div>

          <div class="category-tabs">
            <div 
              class="category-tab" 
              :class="{ active: activeCategory === 'all' }"
              @click="activeCategory = 'all'"
            >
              全部
            </div>
            <div 
              v-for="category in categories" 
              :key="category.id"
              class="category-tab"
              :class="{ active: activeCategory === category.id }"
              @click="activeCategory = category.id"
            >
              {{ category.name }}
            </div>
          </div>

          <div v-if="loading" class="loading-container">
            <div class="loading-spinner"></div>
            <p>加载中...</p>
          </div>

          <div v-else-if="error" class="error-container">
            <div class="error-icon">⚠️</div>
            <p>{{ error }}</p>
            <button class="retry-button" @click="fetchWebsites">重试</button>
          </div>

          <div v-else class="websites-grid">
            <div 
              v-for="website in filteredWebsites" 
              :key="website.id"
              class="website-card"
              @click="openWebsite(website.url)"
            >
              <div class="website-icon">
                <img :src="getFaviconUrl(website.url)" :alt="website.name" />
              </div>
              <div class="website-name">{{ website.name }}</div>
              <div class="website-url">{{ website.url }}</div>
              <div class="website-actions">
                <button 
                  class="delete-button"
                  @click.stop="deleteWebsite(website.id)"
                >
                  ×
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const { createApp, ref, computed, onMounted } = Vue;
      
      createApp({
        setup() {
          const categories = ref([]);
          const websites = ref([]);
          const searchKeyword = ref('');
          const activeCategory = ref('all');
          const loading = ref(false);
          const error = ref(null);

          const searchEngines = ref([
            { id: 'baidu', name: '百度', url: 'https://www.baidu.com/s?wd=' },
            { id: 'google', name: '谷歌', url: 'https://www.google.com/search?q=' },
            { id: 'bing', name: '必应', url: 'https://www.bing.com/search?q=' },
            { id: '360', name: '360', url: 'https://www.so.com/s?q=' }
          ]);
          
          const activeSearchEngine = ref('baidu');

          const selectSearchEngine = (engineId) => {
            activeSearchEngine.value = engineId;
            localStorage.setItem('selectedSearchEngine', engineId);
          };

          const getCurrentSearchEngineUrl = () => {
            const engine = searchEngines.value.find(e => e.id === activeSearchEngine.value);
            return engine ? engine.url : searchEngines.value[0].url;
          };

          const handleSearch = () => {
            if (!searchKeyword.value.trim()) return;
            const keyword = encodeURIComponent(searchKeyword.value.trim());
            const searchUrl = getCurrentSearchEngineUrl() + keyword;
            window.open(searchUrl, '_blank', 'noopener,noreferrer');
          };

          const getFaviconUrl = (url) => {
            try {
              const urlObj = new URL(url);
              return `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=32`;
            } catch {
              return '';
            }
          };

          const openWebsite = (url) => {
            try {
              let formattedUrl = url;
              if (!/^https?:\/\//i.test(url)) {
                formattedUrl = 'https://' + url;
              }
              window.open(formattedUrl, '_blank', 'noopener,noreferrer');
            } catch (err) {
              console.error('打开网站失败:', err);
            }
          };

          const filteredWebsites = computed(() => {
            let result = websites.value;
            if (activeCategory.value !== 'all') {
              result = result.filter(w => w.category_id == activeCategory.value);
            }
            if (searchKeyword.value.trim()) {
              const keyword = searchKeyword.value.toLowerCase();
              result = result.filter(w => 
                w.name.toLowerCase().includes(keyword) || 
                w.url.toLowerCase().includes(keyword)
              );
            }
            return result;
          });

          const fetchCategories = async () => {
            try {
              const response = await axios.get('http://localhost:5001/api/categories');
              categories.value = response.data;
            } catch (err) {
              console.error('获取分类失败:', err);
            }
          };

          const fetchWebsites = async () => {
            try {
              loading.value = true;
              error.value = null;
              const response = await axios.get('http://localhost:5001/api/websites');
              websites.value = response.data.websites || [];
            } catch (err) {
              console.error('获取网站失败:', err);
              error.value = '获取网站失败，请稍后重试';
            } finally {
              loading.value = false;
            }
          };

          const deleteWebsite = async (websiteId) => {
            try {
              await axios.delete(`http://localhost:5001/api/websites/${websiteId}`);
              await fetchWebsites();
            } catch (err) {
              console.error('删除网站失败:', err);
            }
          };

          onMounted(async () => {
            const savedEngine = localStorage.getItem('selectedSearchEngine');
            if (savedEngine && searchEngines.value.find(e => e.id === savedEngine)) {
              activeSearchEngine.value = savedEngine;
            }
            await fetchCategories();
            await fetchWebsites();
          });

          return {
            categories,
            websites,
            searchKeyword,
            activeCategory,
            loading,
            error,
            searchEngines,
            activeSearchEngine,
            selectSearchEngine,
            handleSearch,
            getFaviconUrl,
            openWebsite,
            filteredWebsites,
            fetchWebsites,
            deleteWebsite
          };
        }
      }).mount('#app');
    </script>
  </body>
</html>
